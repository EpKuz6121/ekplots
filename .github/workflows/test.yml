name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Windows needs MSVC on PATH for the C extension build — the
      # standard GitHub-hosted windows-latest runner already has Visual
      # Studio installed, this action just puts cl.exe on PATH for the
      # step that follows.
      - name: Set up MSVC (Windows only)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ekplots (compiles the C core for this platform)
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Run the 15-plot smoke script (saves real PNGs)
        run: python smoke_all_15.py
